<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookVerse Final</title>

<style>
body{margin:0;font-family:Arial;background:#eaeded}

/* HEADER */
header{
background:#131921;color:white;
display:flex;justify-content:space-between;
padding:10px;
position:sticky;top:0;
}

.search input{
padding:7px;border:none;border-radius:4px;
}

/* GRID */
.container{padding:15px}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

@media(min-width:768px){
.grid{grid-template-columns:repeat(4,1fr)}
}

/* CARD */
.card{
background:white;
border-radius:10px;
padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
position:relative;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.btn{
background:#ff9900;
padding:8px;
margin-top:5px;
text-align:center;
border-radius:20px;
cursor:pointer;
}

.icon{
position:absolute;
top:8px;
right:8px;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div>📚 BookVerse</div>
<div class="search">
<input id="search" placeholder="Search books...">
</div>
</header>

<div class="container">
<div class="grid" id="list"></div>
</div>

<script>

let books=[
{name:"Atomic Habits",price:399,img:"https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800"},
{name:"Rich Dad Poor Dad",price:299,img:"https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=800"},
{name:"Psychology of Money",price:349,img:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=800"},
{name:"Deep Work",price:399,img:"https://images.unsplash.com/photo-1455885666463-1b3d6c1d7c8d?w=800"}
];

function render(){
let list=document.getElementById("list");
list.innerHTML="";

books.forEach((b,i)=>{
list.innerHTML+=`
<div class="card">
<div class="icon" onclick="alert('Added to wishlist')">🤍</div>
<img src="${b.img}">
<h4>${b.name}</h4>
<p>₹${b.price}</p>
<div class="btn" onclick="alert('Added to cart')">Add to Cart</div>
</div>
`;
});
}

document.getElementById("search").addEventListener("input",function(){
let v=this.value.toLowerCase();

document.querySelectorAll(".card").forEach((c,i)=>{
if(books[i].name.toLowerCase().includes(v)){
c.style.display="block";
}else{
c.style.display="none";
}
});
});

render();

</script>

</body>
</html>
